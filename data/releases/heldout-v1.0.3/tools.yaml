              "Makkah",
              "Madinah",
              "Taif",
              "Dammam",
              "Abha"
            ],
            "description": "Canonical English origin city."
          },
          "destination_city": {
            "type": "string",
            "enum": [
              "Riyadh",
              "Jeddah",
              "Makkah",
              "Madinah",
              "Taif",
              "Dammam",
              "Abha"
            ],
            "description": "Canonical English destination city."
          },
          "transport_mode": {
            "type": "string",

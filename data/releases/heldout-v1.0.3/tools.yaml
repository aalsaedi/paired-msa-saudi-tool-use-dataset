          "destination_city": {
            "type": "string"
          },
          "travel_date": {
            "type": "string"
          },
          "transport_mode": {
            "type": "string"
          },
          "trips": {
            "type": "array"
          }
        }
      },
      "normalization": {
        "origin_city": "Arabic and English aliases map to the canonical enum.",
        "destination_city": "Arabic and English aliases map to the canonical enum.",
        "travel_date": "Arabic-Indic digits and relative dates resolve to ISO using context.reference_datetime.",
        "transport_mode": "Arabic expressions map to train, bus, or flight."

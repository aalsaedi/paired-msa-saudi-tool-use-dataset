    {
      "name": "search_intercity_trips",
      "domain": "travel",
      "description": "Search deterministic mock intercity trips between supported Saudi cities for a date and transport mode. Use this to find departures and prices, not to estimate generic travel duration.",
      "side_effects": "none",
      "input_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "origin_city",
          "destination_city",
          "travel_date",
          "transport_mode"
        ],
        "properties": {
          "origin_city": {
            "type": "string",
            "enum": [
              "Riyadh",
              "Jeddah",
              "Makkah",
              "Madinah",
              "Taif",
              "Dammam",
              "Abha"
            ],
            "description": "Canonical English origin city."
          },
          "destination_city": {
            "type": "string",
            "enum": [
              "Riyadh",
              "Jeddah",
              "Makkah",
              "Madinah",
              "Taif",
              "Dammam",
              "Abha"
            ],
            "description": "Canonical English destination city."
          },
          "travel_date": {
            "type": "string",
            "format": "date",
            "description": "Gregorian date in YYYY-MM-DD format."
          },
          "transport_mode": {
            "type": "string",
            "enum": [
              "train",
              "bus",
              "flight"
            ],
            "description": "Requested transport mode."
          }

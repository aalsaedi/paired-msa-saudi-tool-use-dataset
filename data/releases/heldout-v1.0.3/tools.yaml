    {
      "name": "convert_currency",
      "domain": "finance",
      "description": "Convert an amount between supported currencies using a fixed mock exchange-rate snapshot. Use this for currency conversion, not financial advice or live market rates.",
      "side_effects": "none",
      "input_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "amount",
          "from_currency",
          "to_currency"
        ],
        "properties": {
          "amount": {
            "type": "number",
            "minimum": 0,
            "description": "Non-negative monetary amount."
          },
          "from_currency": {
            "type": "string",
            "enum": [
              "SAR",
              "USD",
              "EUR",
              "GBP",
              "AED"
            ],
            "description": "ISO source currency."
          },
          "to_currency": {
            "type": "string",
            "enum": [
              "SAR",
              "USD",
              "EUR",
              "GBP",
              "AED"
            ],
            "description": "ISO target currency."
          }
        }
      },
      "output_schema": {
        "type": "object",
        "required": [
          "amount",
          "from_currency",
          "to_currency",
          "converted_amount",
          "rate",
          "rate_snapshot"
        ],
        "properties": {
          "amount": {
            "type": "number"
          },
          "from_currency": {
            "type": "string"
          },
          "to_currency": {
            "type": "string"
          },
          "converted_amount": {
            "type": "number"
          },
          "rate": {
            "type": "number"
          },
          "rate_snapshot": {
            "type": "string"
          }
        }
      },
      "normalization": {
        "amount": "Arabic-Indic digits and Arabic number words normalize to a numeric value.",
        "from_currency": "Arabic currency names and common English aliases map to ISO codes.",
        "to_currency": "Arabic currency names and common English aliases map to ISO codes."
      },
      "boundary": {
        "in_scope": [
          "mock conversion among SAR, USD, EUR, GBP, and AED"
        ],
        "out_of_scope": [
          "live exchange rates",
          "investment advice",
          "fees or remittance execution",
          "unsupported currencies"
        ]
      }
    }

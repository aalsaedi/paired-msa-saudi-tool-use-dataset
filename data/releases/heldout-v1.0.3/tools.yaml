{
  "registry_version": "1.0.0",
  "display_language": "en",
  "tool_names_and_argument_keys_language": "en",
  "execution_policy": "deterministic_mock",
  "side_effect_policy": "read_only",
  "reference_context": {
    "timezone": "Asia/Riyadh",
    "currency_rate_snapshot": "2026-07-23",
    "supported_cities": [
      "Riyadh",
      "Jeddah",
      "Makkah",
      "Madinah",
      "Taif",
      "Dammam",
      "Abha"
    ]
  },
  "tools": [
    {
      "name": "get_weather",
      "domain": "weather",
      "description": "Return a deterministic weather forecast for a supported Saudi city and an ISO calendar date. Use this for temperature and weather conditions, not air quality.",
      "side_effects": "none",
      "input_schema": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "city",
          "date"
        ],
        "properties": {
          "city": {
            "type": "string",
            "enum": [
              "Riyadh",
              "Jeddah",
              "Makkah",
              "Madinah",
              "Taif",
              "Dammam",
              "Abha"
            ],
            "description": "Canonical English city label."
          },
          "date": {
            "type": "string",
            "format": "date",
            "description": "Gregorian date in YYYY-MM-DD format, resolved against the record reference datetime."
          }
        }
      },
      "output_schema": {
        "type": "object",
        "required": [
          "city",
          "date",
          "condition",
          "high_c",
          "low_c"
        ],
        "properties": {
          "city": {
            "type": "string"
          },
          "date": {
            "type": "string"
          },
          "condition": {
            "type": "string"
          },
          "high_c": {
            "type": "number"
          },
          "low_c": {
            "type": "number"
          }
        }
      },
      "normalization": {
        "city": "Arabic and English aliases map to the canonical enum.",
        "date": "Arabic-Indic digits and relative dates resolve to ISO using context.reference_datetime."
      },
      "boundary": {
        "in_scope": [
          "weather condition",
          "high and low temperature"
        ],
        "out_of_scope": [
          "air quality",
          "historical climate",
          "cities outside the supported list"
        ]
      }
    },
